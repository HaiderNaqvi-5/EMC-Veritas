name: Keep Render API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check the public API readiness endpoint
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 90 \
            --retry 1 \
            --retry-delay 5 \
            https://emc-veritas-api.onrender.com/api/health/ready
