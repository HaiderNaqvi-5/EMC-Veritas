services:
  - type: web
    name: emc-veritas-api
    runtime: python
    rootDir: backend
    # Reinstall the local application package on every release. The package
    # version is intentionally stable during development, so a normal install
    # can otherwise make it difficult to prove that the newly checked-out
    # renderer source is the code actually running in production.
    buildCommand: pip install --no-cache-dir --force-reinstall .
    # Render Free does not support preDeployCommand. Apply reviewed Alembic
    # migrations before a release, then deploy the already-migrated service.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: emc-veritas
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: "none"
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
