[project]
name = "emc-veritas-api"
version = "0.1.0"
description = "EMC Veritas FastAPI service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic-settings>=2.5,<3.0", "itsdangerous>=2.2,<3.0",
  "sqlalchemy>=2.0,<3.0", "alembic>=1.13,<2.0", "psycopg[binary]>=3.2,<4.0",
  "httpx>=0.27,<1.0", "python-multipart>=0.0.9,<1.0",
  "argon2-cffi>=23.1,<24.0", "pymupdf>=1.24,<2.0", "reportlab>=4.2,<5.0",
  "pillow>=10.4,<12.0", "pytesseract>=0.3,<1.0", "openpyxl>=3.1,<4.0", "qrcode[pil]>=7.4,<9.0", "python-multipart>=0.0.20,<1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# FastAPI dependencies are intentionally declared as function defaults.
ignore = ["B008"]
